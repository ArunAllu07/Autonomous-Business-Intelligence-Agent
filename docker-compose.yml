services:

  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_dev_password

    ports:
      - "5432:5432"

    volumes:
      - aura_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aura_user -d aura"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - aura_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: aura-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://aura_user:aura_dev_password@postgres:5432/aura

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: aura-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - api


volumes:

  aura_postgres_data:

  aura_redis_data: